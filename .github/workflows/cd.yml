name: CD Metradingplat Gestion Escaneres

on:
  workflow_run:
    workflows: ["CI Metradingplat Gestion Escaneres"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Acquire exclusive deploy lock (avoid overwhelming the shared host)
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          MAX_WAIT=2400
          MAX_LOCK_AGE=1800
          waited=0
          while ! mkdir "$LOCK_DIR" 2>/dev/null; do
            lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR" 2>/dev/null || date +%s) ))
            if [ "$lock_age" -gt "$MAX_LOCK_AGE" ]; then
              echo "Lock abandonado hace ${lock_age}s (el dueno probablemente murio) -- liberando y tomando control"
              rm -rf "$LOCK_DIR"
              continue
            fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "Timeout esperando el lock de deploy compartido"
              exit 1
            fi
            echo "Otro deploy de MeTradingPlat esta en curso, esperando... (${waited}s/${MAX_WAIT}s)"
            sleep 10
            waited=$((waited + 10))
          done
          echo "${{ github.repository }}" > "$LOCK_DIR/owner"
          echo "Lock de deploy adquirido"

      - name: Create Docker Network
        run: |
          docker network create metradingplat-network || echo "Network already exists"

      - name: Run Postgres Container
        run: |
          # Check if container exists, if so start it, if not run it
          if [ -z "$(docker ps -a -q -f name=postgres-scanners)" ]; then
            echo "Creating and starting postgres-scanners container..."
            docker run -d \
              --name "postgres-scanners" \
              --network "metradingplat-network" \
              --restart "always" \
              --cpus "0.5" \
              --memory "256m" \
              --memory-swap "256m" \
              -e POSTGRES_DB="bd_scanners" \
              -e POSTGRES_USER="user_scanners" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -v postgres_scanners_data:/var/lib/postgresql/data \
              postgres:15-alpine
          else
            echo "postgres-scanners container exists, ensuring it is started..."
            docker start postgres-scanners
          fi

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h
          echo "--- CLEANING SHARED BASE IMAGES ---"
          docker image rm -f eclipse-temurin:21-jdk eclipse-temurin:21-jre-alpine || true
          echo "--- CLEANING SERVICE METADATA ---"
          docker rm -f scanner-management-service || true
          docker image rm -f virtud142/metradingplat_scanner_management_service:latest || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3 4 5; do
            docker pull virtud142/metradingplat_scanner_management_service:latest && exit 0 || \
            (echo "Attempt $i failed, waiting $((i * 15))s..." && sleep $((i * 15)))
          done
          echo "All pull attempts failed. Docker daemon might need a manual restart."
          exit 1

      - name: Delete Old Application Container
        run: |
          # docker stop (SIGTERM) antes de rm -f (SIGKILL directo) -- le da
          # tiempo al shutdown hook de Eureka a desregistrarse limpiamente.
          # Sin esto, el gateway seguia enrutando a la IP vieja del
          # contenedor muerto hasta que la lease expirara (confirmado en
          # vivo: 500 "Connection refused" por varios minutos tras cada
          # deploy de un servicio registrado en Eureka).
          docker stop scanner-management-service 2>/dev/null || true
          docker rm -f scanner-management-service || true

      - name: Run Application Container
        run: |
          docker run -d \
            --name "scanner-management-service" \
            --network "metradingplat-network" \
            --restart "unless-stopped" \
            --cpus "0.5" \
            --memory "384m" \
            --memory-swap "384m" \
            --label project="metradingplat" \
            --label service="scanner-management-service" \
            -e SPRING_PROFILES_ACTIVE="prod" \
            -e DB_HOST="postgres-scanners" \
            -e DB_PORT="5432" \
            -e DB_NAME="bd_scanners" \
            -e POSTGRES_USER="user_scanners" \
            -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            -e SSL_ENABLED="false" \
            -e SSL_MODE="disable" \
            -e EUREKA_HOST="directory" \
            virtud142/metradingplat_scanner_management_service:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for scanner-management-service service..."
          CURRENT_IMAGE=$(docker inspect scanner-management-service --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            docker images --filter "label=service=scanner-management-service" --format "{{.ID}}" | while read img; do
              if [ "$img" != "${CURRENT_IMAGE:7:12}" ]; then
                echo "Removing old image: $img"
                docker rmi -f $img 2>/dev/null || true
              fi
            done
          fi
          docker images virtud142/metradingplat_scanner_management_service --format "{{.ID}} {{.Tag}}" | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          echo "Cleaning stopped containers for scanner-management-service service..."
          docker ps -a --filter "label=service=scanner-management-service" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep scanner-management-service

      - name: Release exclusive deploy lock
        if: always()
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner")" = "${{ github.repository }}" ]; then
            rm -rf "$LOCK_DIR"
          fi
