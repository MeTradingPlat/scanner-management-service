## Filtros de Volumen
filter.volume.name=Volume
filter.volume.description=Mide el volumen negociado de una acci\u00F3n en un per\u00EDodo espec\u00EDfico, permitiendo filtrar acciones por su actividad de trading

filter.averageVolume.name=Average Volume
filter.averageVolume.description=Calcula el volumen promedio diario en un per\u00EDodo determinado, \u00FAtil para identificar acciones con liquidez consistente

filter.volumenPostPre.name=Post/Pre Market Volume
filter.volumenPostPre.description=Mide el volumen negociado fuera del horario regular de mercado (pre-market y after-hours)

filter.relativeVolume.name=Relative Volume
filter.relativeVolume.description=Compara el volumen actual con el promedio de las \u00FAltimas velas del mismo timeframe, expresado como porcentaje

filter.relativeVolumeSameTime.name=Relative Volume (Same Time)
filter.relativeVolumeSameTime.description=Compara el volumen acumulado del d\u00EDa con el volumen acumulado promedio a la misma hora en las \u00FAltimas 20 sesiones

filter.volumeSpike.name=Volume Spike
filter.volumeSpike.description=Detecta aumentos repentinos de volumen (Volume Spike) comparando la candle actual con el promedio de las anteriores

## Filtros de Precio y Movimiento
filter.change.name=Change
filter.change.description=Mide el cambio absoluto o porcentual del precio desde un punto de referencia espec\u00EDfico

filter.percentageChange.name=Percentage Change
filter.percentageChange.description=Mide el cambio porcentual del precio en un per\u00EDodo espec\u00EDfico de tiempo

filter.precio.name=Price
filter.precio.description=Filtra acciones por su precio actual, permitiendo buscar en rangos espec\u00EDficos de precios

filter.gapFromClose.name=Gap From Close
filter.gapFromClose.description=Mide el Gap entre el Close anterior y el Open actual

filter.positionInRange.name=Position in Range
filter.positionInRange.description=Indica la posici\u00F3n del precio actual dentro del rango High-Low de un per\u00EDodo determinado

filter.percentageRange.name=Percentage Range
filter.percentageRange.description=Mide el rango porcentual (High-Low) de la acci\u00F3n en un per\u00EDodo espec\u00EDfico

filter.rangeDollars.name=Dollar Range
filter.rangeDollars.description=Mide la distancia en d\u00F3lares entre el High y el Low en un per\u00EDodo determinado

filter.crossingAboveBelow.name=Crossing Above/Below
filter.crossingAboveBelow.description=Detecta cuando el precio cruza por encima o por debajo de niveles clave

filter.halt.name=Halt
filter.halt.description=Alerta cuando una acci\u00F3n entra en Halt (suspensi\u00F3n de negociaci\u00F3n)

## Filtros de Volatilidad
filter.atr.name=ATR
filter.atr.description=ATR (Average True Range): mide la volatilidad promedio de una acci\u00F3n

filter.atrp.name=ATRP
filter.atrp.description=ATR relativo al precio de cierre (Close), expresado como porcentaje

filter.relativeRange.name=Relative Range
filter.relativeRange.description=Compara el rango actual contra el ATR diario

## Filtros de Momentum e Indicadores T\u00E9cnicos
filter.rsi.name=RSI
filter.rsi.description=RSI (Relative Strength Index): mide la velocidad y el cambio de los movimientos del precio

filter.distanceFromVwap.name=Distance From VWAP
filter.distanceFromVwap.description=Mide la distancia del precio actual al VWAP

filter.distanceFromEma.name=Distance From EMA
filter.distanceFromEma.description=Mide la distancia del precio actual a la EMA

filter.distanceFromMa.name=Distance From MA
filter.distanceFromMa.description=Mide la distancia del precio actual a la MA (SMA)

filter.backToEmaAlert.name=Back to EMA Alert
filter.backToEmaAlert.description=Alerta cuando el precio vuelve a una EMA despu\u00E9s de alejarse (Back to EMA)

filter.throughEmaVwapAlert.name=EMA/VWAP Cross Alert
filter.throughEmaVwapAlert.description=Detecta cuando el precio cruza (cross) una EMA o el VWAP, hacia arriba o hacia abajo

filter.emaVwapSupportResistance.name=EMA/VWAP Support/Resistance
filter.emaVwapSupportResistance.description=Detecta cuando una EMA o el VWAP act\u00FAa como Support o Resistance

## Filtros de Patrones de Precio y Tiempo
filter.bearishBullishEngulfing.name=Bearish/Bullish Engulfing
filter.bearishBullishEngulfing.description=Patr\u00F3n de candles (Bearish/Bullish Engulfing) que sugiere una reversi\u00F3n de tendencia

filter.consecutiveCandles.name=Consecutive Candles
filter.consecutiveCandles.description=Cuenta candles verdes o rojas consecutivas para identificar momentum

filter.firstCandle.name=First Candle
filter.firstCandle.description=Eval\u00FAa si la First Candle del d\u00EDa es Bullish o Bearish

filter.highLowOfDay.name=High/Low of Day
filter.highLowOfDay.description=Alerta cuando el precio rompe el High o el Low of Day

filter.newCandleHighLow.name=New Candle High/Low
filter.newCandleHighLow.description=Alerta cuando la candle cierra con un nuevo High (o Low) frente a las \u00FAltimas N candles

filter.percentagePullbackHighsLows.name=Percentage Pullback Highs/Lows
filter.percentagePullbackHighsLows.description=Mide el Pullback porcentual desde el High (o el rebote desde el Low) de las \u00FAltimas N candles de 1 minuto

filter.breakOverRecentHighsLows.name=Break Over Recent Highs/Lows
filter.breakOverRecentHighsLows.description=Alerta cuando el precio de cierre hace Break Over del High (o Low) de las \u00FAltimas N candles

filter.openingRangeBreakdown.name=Opening Range Breakdown
filter.openingRangeBreakdown.description=Detecta un Breakdown por debajo del Opening Range

filter.openingRangeBreakout.name=Opening Range Breakout
filter.openingRangeBreakout.description=Detecta un Breakout por encima del Opening Range

filter.pivots.name=Pivots
filter.pivots.description=Detecta niveles clave de Support y Resistance basados en Pivot Points

## Indicadores de salida (stop loss / take profit) -- catalogo separado de los
## filtros de escaneo: no deciden si un simbolo entra en los resultados, sino
## el nivel de precio para cerrar una posicion ya abierta
indicatorExit.pivots.name=Pivotes (Salida)
indicatorExit.pivots.description=Usa los pivotes de precio mas cercanos como nivel de stop loss / take profit

filter.minutosInMarket.name=Minutes in Market
filter.minutosInMarket.description=Filtra basado en minutos transcurridos desde la apertura del mercado

filter.orderBlockImbalance.name=Order Block + Imbalance
filter.orderBlockImbalance.description=Detecta un Order Block con un imbalance de 3 candles en el extremo de un rango, seg\u00FAn el concepto ICT/Smart Money

filter.liquidityGrabCandle.name=Liquidity Grab Candle
filter.liquidityGrabCandle.description=Detecta una candle con wick largo que hace Liquidity Grab de un extremo reciente y cierra de vuelta dentro del rango

filter.accelerationDeceleration.name=Acceleration - Deceleration
filter.accelerationDeceleration.description=Detecta un tramo de candles con body grande (Acceleration) seguido de una ca\u00EDda abrupta en el tama\u00F1o del body (Deceleration)

filter.confirmationCandle.name=Confirmation Candle
filter.confirmationCandle.description=Detecta una candle de body dominante que forma un imbalance de 2 candles contra la anterior, usada como trigger de entrada

filter.rangeExtremeProximity.name=Range Extreme Proximity
filter.rangeExtremeProximity.description=Verifica que el precio actual est\u00E9 cerca del High o Low del rango reciente, el contexto que le da sentido a un Order Block en ese extremo

filter.rangeConfluenceD1H4H1.name=Range Confluence D1/H4/H1
filter.rangeConfluenceD1H4H1.description=Verifica que los rangos D1, H4 y H1 coincidan en la misma zona de precio (confluence)

## Filtros de Caracter\u00EDsticas Fundamentales
filter.float.name=Float
filter.float.description=N\u00FAmero de acciones disponibles para negociaci\u00F3n p\u00FAblica

filter.sharesOutstanding.name=Shares Outstanding
filter.sharesOutstanding.description=Total de acciones emitidas por la empresa

filter.marketCap.name=Market Cap
filter.marketCap.description=Valor total de mercado de una compa\u00F1\u00EDa

filter.shortInterest.name=Short Interest
